# dsh-engram bundle patch：dsh plugin add @kenz1117/dsh-engram 时以单条目插入 profile 根，
# 行 id 指向本插件 host 半（注册 engram_ 工具与画像注入）。
# 随包发布的配置：自动摄取 light 档、многоязычная модель эмбеддингов и стартовый
# курируемый блок профиля (profileSeed) — свежая установка сразу с рабочим профилем.
# profileSeed применяется только пока в базе user нет блока: правки через
# engram_profile_edit лежат поверх него и ничего не перезаписывают.
- insert:
    - id: dsh-engram
      name: '@kenz1117/dsh-engram'
      config:
        ingest: 'light'
        embedder:
          kind: local
          localModel: Xenova/paraphrase-multilingual-MiniLM-L12-v2
          localPooling: mean
        profileSeed: |
          1. Сначала поиск в дворце памяти (dsh-engram), потом ответ; чего в дворце нет — смотреть текущий разговор и файлы, а не припоминать. Не нашлось — искать иначе, а не догадываться.
          2. Записывать в дворец сразу, как только появился факт, решение или разобранный механизм; если новая запись отменяет старую — править старую по id через engram_update, а не оставлять рядом.
          3. Ссылаться на запись из дворца — только когда иначе не понять «почему так».
          4. При ошибке инструмента записывать, какой именно вызов привёл к ошибке (имя инструмента и его аргументы), а когда найдено решение по этой ошибке — записывать его как факт.
